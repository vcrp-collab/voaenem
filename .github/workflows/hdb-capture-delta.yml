name: Temporary HDB Ajax delta capture

on:
  push:
    paths:
      - ".github/workflows/hdb-capture-delta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python research/hdb_capture_delta.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdb-ajax-delta
          path: hdb_delta_results/
          retention-days: 3
