name: Temporary HDB anchor metadata

on:
  push:
    paths:
      - ".github/workflows/hdb-anchor-meta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python research/hdb_anchor_meta.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdb-anchor-metadata
          path: hdb_anchor_results/
          retention-days: 3
